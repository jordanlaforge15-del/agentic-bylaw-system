name: halifax_pedestrian_oriented_commercial_streets
publisher: Halifax Regional Municipality
format: geojson
# Schedule 7 of the Regional Centre Land Use By-Law ("Pedestrian-Oriented
# Commercial Streets", published cartographically as Map 19) is a MAP-ONLY
# schedule: HRM does not expose the designated street segments as a textual
# list, and there is no dedicated open-data FeatureServer for it (unlike the
# height/FAR/heritage schedules). The by-law text references it in 23+
# fragments (ground-floor uses s.38(2)/s.69(d), maximum setbacks, streetwall
# storeys, ground-floor height, hard landscaping) but never enumerates the
# streets — so no retrieval call can answer "does this address abut a POCS
# street" without a spatial layer.
#
# This dataset supplies that missing layer. The geometry here is digitized
# from Schedule 7 / Map 19: one LineString per designated corridor, keyed by
# a stable SEGMENT_ID. It is deliberately committed as a repo GeoJSON
# (source_path) rather than fetched from a URL because the map-only schedule
# has no machine-readable upstream to pull from. Replace with surveyor-grade
# centreline geometry (or a flagged subset of halifax_street_centerlines) if
# HRM ever publishes the segments as open data — the SEGMENT_ID feature_key
# keeps re-ingest idempotent for downstream consumers.
source_path: data/geo-datasets/pedestrian_oriented_commercial_streets_schedule7.geojson
crs: EPSG:4326

# Schedule 7 is a schedule of the Regional Centre LUB (document 4), so it
# binds to that document's "Schedule 7" fragment — the p.27 list-of-schedules
# reference the by-law text points at. Like the other RCLUB schedule overlays
# (height/FAR/heritage), this is a links_to dataset, not a role dataset.
links_to:
  document_match:
    municipality: HRM
    bylaw_name: Regional Centre Land Use By-Law
  fragment_citation: Schedule 7

attributes:
  # SEGMENT_ID is our stable per-corridor identifier. OBJECTID-style ids from
  # a future ArcGIS reload would churn on full reloads; SEGMENT_ID survives
  # them, keeping re-ingest idempotent for consumers that key off feature_key.
  feature_key: SEGMENT_ID
  canonical:
    # Surface the street name so a spatial hit can be cited verbatim ("the lot
    # abuts Quinpool Road, a pedestrian-oriented commercial street per
    # Schedule 7") instead of the agent hallucinating the corridor name.
    street_name:
      from: STREET
      type: string
  ignore:
    # Retained in attributes_json for provenance/diagnostics but not surfaced
    # through the canonical retrieval vocabulary.
    - SCHEDULE
    - EXTENT
    - SOURCE
