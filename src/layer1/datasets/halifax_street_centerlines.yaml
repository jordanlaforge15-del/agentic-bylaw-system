name: halifax_street_centerlines
publisher: Halifax Regional Municipality
format: geojson
# HRM publishes street centrelines under the "StreetNetwork" service on the
# same ArcGIS host as the parcels layer. Geometry is esriGeometryPolyline,
# one row per street segment, with ASSETID as a stable per-segment id. We
# request outSR=4326 so the parser gets WGS-84 directly without a client-
# side reproject step. The ArcGIS pagination (max 2000 rows/page) is
# handled transparently by the ingest pipeline.
source_url: https://services2.arcgis.com/11XBiaBYA9Ep0yNJ/arcgis/rest/services/StreetNetwork/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson
crs: EPSG:4326

# role=road_centerlines lets the case-open spatial extractor find this
# dataset for the centerline-buffer frontage algorithm without hard-coding
# its numeric id. Like property_parcels, road_centerlines is base geography
# (not a bylaw fragment) so links_to is omitted.
role: road_centerlines

attributes:
  # ASSETID is HRM's stable per-segment identifier. OBJECTID changes on
  # full reloads of the layer; ASSETID survives them, which keeps re-ingest
  # idempotent for downstream consumers that key off feature_key.
  feature_key: ASSETID
  # ABS-469: the per-segment address ranges are no longer diagnostic-only.
  # A civic number covered by no segment's range is an address that does not
  # exist, which is the difference between refusing "100 Robie Street" and
  # answering it from an interpolated point on somebody else's parcel. The
  # four range fields are per side of the segment (left/right), and street
  # name and type are separate columns upstream — Jubilee Road, Jubilee Court
  # and Jubilee Lane share a STR_NAME and carry different ranges.
  #
  # Optional throughout: HRM publishes 0/0 ranges for segments with no
  # addressing (ramps, service lanes) and leaves STR_TYPE null on a few.
  # ``layer2.retrieval.civic_address`` also reads the raw STR_NAME/FROM_LEFT
  # passthrough, so the 18,468 segments ingested before this mapping existed
  # keep working without a re-ingest.
  canonical:
    street_name: { from: STR_NAME, type: string, optional: true }
    street_type: { from: STR_TYPE, type: string, optional: true }
    civic_from_left: { from: FROM_LEFT, type: int, optional: true }
    civic_to_left: { from: TO_LEFT, type: int, optional: true }
    civic_from_right: { from: FROM_RIGHT, type: int, optional: true }
    civic_to_right: { from: TO_RIGHT, type: int, optional: true }
  ignore:
    - OBJECTID
    - Shape__Length
