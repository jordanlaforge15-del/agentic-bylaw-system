name: halifax_zoning_boundaries
publisher: Halifax Regional Municipality
format: geojson
# Live ArcGIS REST endpoint. The ingester paginates automatically when the
# URL contains '/arcgis/rest/services/'. outSR=4326 asks the server to
# reproject from EPSG:3857 (the layer's native CRS) into EPSG:4326, so our
# parser gets a CRS-clean payload without needing pyproj on the client side.
source_url: https://services2.arcgis.com/11XBiaBYA9Ep0yNJ/arcgis/rest/services/ZoningBoundaries/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson
crs: EPSG:4326

# NOTE (ABS-472): this layer is HRM-WIDE. document_match below is only the
# document the layer is *published alongside* — it is NOT the by-law that
# governs every feature. 22 by-law areas appear in this dataset and only two
# of them (Regional Centre, Halifax Mainland) are ingested, so
# ``governing_bylaw_from`` is what retrieval cites from: the per-feature
# by-law resolved from BYLAW_ID, not this dataset-level link. Without it a
# DH-1 parcel (Downtown Halifax LUB, BYLAW_ID 22) was served with a Regional
# Centre LUB citation.
links_to:
  document_match:
    municipality: HRM
    bylaw_name: Regional Centre Land Use By-Law
  fragment_citation: Zoning Schedule
  governing_bylaw_from:
    name_attribute: bylaw_area_name
    code_attribute: bylaw_area_code

attributes:
  feature_key: GLOBALID
  canonical:
    zone_code:
      from: ZONE
      type: string
    zone_description:
      from: DESCRIPTION
      type: string
      optional: true
    bylaw_area_id:
      from: BYLAW_ID
      type: int
      optional: true
    # bylaw_area_code / bylaw_area_name resolve the upstream BYLAW_ID
    # integer (publisher-internal — not unique across cities) to a
    # publisher-prefixed code and a human-readable name. The chat agent
    # quotes bylaw_area_name verbatim, so it never has to invent a label
    # from the bare integer — see ABS-66, where BYLAW_ID 9 (Halifax
    # Mainland) was being mislabelled as "Halifax Peninsula".
    bylaw_area_code:
      from: BYLAW_ID
      type: string
      optional: true
      lookup: bylaw_area_subtypes
      lookup_field: code
    bylaw_area_name:
      from: BYLAW_ID
      type: string
      optional: true
      lookup: bylaw_area_subtypes
      lookup_field: name
    effective_date:
      # ArcGIS REST returns SDATE as Unix epoch milliseconds; the Hub's
      # static GeoJSON export uses RFC 2822 strings for the same value.
      # Picking epoch_ms_date here matches the URL source we configured
      # above. If you switch this dataset to a static-file source_path,
      # change to rfc2822_date.
      from: SDATE
      type: epoch_ms_date
      optional: true
    source_case:
      from: SOURCE
      type: string
      optional: true
  ignore:
    - OBJECTID
    - FCODE
    - SACC
    - Shape__Area
    - Shape__Length

# The BYLAW_ID subtype table lives in a shared file: halifax_height_precincts
# stamps the same HRM by-law-area codes on its own features (ABS-473), and a
# table copied into two configs drifts — a code added to one and not the other
# resolves to no name, which silently degrades that layer back to its
# dataset-level by-law link.
lookups_from:
  - lookups/hrm_bylaw_areas.yaml
