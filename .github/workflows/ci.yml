name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-flight runs for the same ref, except on main where builds must
# complete to avoid a partially-pushed image landing in GHCR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # lint — Python ruff
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests

  # ---------------------------------------------------------------------------
  # typecheck — TypeScript / Next.js
  # ---------------------------------------------------------------------------
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # test — Python pytest
  # Boots the project's custom postgres image (pgvector + postgis) so that
  # migrations referencing both extensions run cleanly.
  # ---------------------------------------------------------------------------
  test:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://layer1:layer1@localhost:5432/layer1
      # This job's DSN is byte-identical to the dev laptop's, so ABS-499's
      # pre-migration snapshot fence would otherwise engage here and fail —
      # there is no `agentic-bylaw-system-postgres-1` on a runner, and a
      # throwaway container that gets destroyed with the job has nothing worth
      # dumping. Opt out explicitly. See docs/DEV_DB_BACKUP.md.
      BYLAW_SKIP_MIGRATION_SNAPSHOT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Build and start postgres (pgvector + postgis)
        run: |
          docker build -t bylaw-postgres -f Dockerfile.postgres .
          docker run -d --name postgres \
            -e POSTGRES_USER=layer1 \
            -e POSTGRES_PASSWORD=layer1 \
            -e POSTGRES_DB=layer1 \
            -p 5432:5432 \
            bylaw-postgres
          until docker exec postgres pg_isready -U layer1 -q; do sleep 1; done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,advisor]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest --tb=short

  # ---------------------------------------------------------------------------
  # golden-gate — the production-deploy gate (ABS-485)
  #
  # evals/golden/golden_cases.json declares that a production deploy requires
  # every entry to be attested by a qualified human and to grade GOLDEN_PASS.
  # Until ABS-485 that rule existed only in prose, which is how a known-wrong
  # answer reached prod (docs/data-gaps/abs461-production-impact.md). This job
  # is what turns it into a gate.
  #
  # It needs no database, no run and no API spend: the condition that holds the
  # gate today is a file check.
  #
  # Enforcement is scoped to the dev -> main promotion, deliberately:
  #   * on main (push or PR targeting it) the gate is HARD — a non-zero exit
  #     fails the job and, via `needs`, blocks both image builds.
  #   * on dev and feature branches it runs and reports, but does not fail.
  #     Feature work is not a production deploy, and a gate that stops every
  #     commit gets deleted rather than satisfied.
  #
  # EXPECTED STATE TODAY: the gate is HELD (0/6 attested), so promotion to main
  # is blocked. That is the designed behaviour, not a broken pipeline. The only
  # legitimate way to open it is a qualified human filling in the attestations
  # per evals/golden/README.md. Do not weaken this job, do not add a bypass
  # input, and above all do not write the attestations to make it green — a
  # model-authored attestation is not evidence, and backfilling one destroys
  # the only non-model ground truth the project has.
  # ---------------------------------------------------------------------------
  golden-gate:
    name: Golden-case deploy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Base install only — no [dev,advisor] extra. The gate reads two JSON
      # files and hashes one; it needs no FastAPI, no database, no model client.
      #
      # This is a constraint the gate's own imports must respect, and it was
      # violated once: scripts/verify_golden_cases.py imported
      # advisor.chat.heading_consistency at module scope, which executes
      # advisor.billing, which imports FastAPI — an [advisor] extra. The gate
      # died at import here and exited 1, which on main is indistinguishable
      # from "gate HELD". A gate that reports a hold it never evaluated is
      # worse than no gate. If this step ever needs a bigger install to pass,
      # that is the bug; fix the import, not this line.
      - name: Install dependencies
        run: pip install -e "."

      - name: Check the golden-case deploy gate
        # Refs go through `env`, not `${{ }}` interpolated into the script body:
        # a fork PR controls its own branch name, and interpolation would splice
        # it into the shell. A gate that can be talked out of running is not one.
        env:
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          python scripts/check_deploy_gate.py
          gate=$?
          set -e
          echo "gate exit code: $gate"
          if [ "$REF" = "refs/heads/main" ] || [ "$BASE_REF" = "main" ]; then
            if [ "$gate" -ne 0 ]; then
              echo "::error::Promotion to main is blocked by the golden-case deploy gate (exit $gate). See the output above and evals/golden/README.md. Do not author attestations to clear this."
            fi
            exit "$gate"
          fi
          if [ "$gate" -ne 0 ]; then
            echo "::warning::The golden-case deploy gate is currently HELD. This does not block work on dev, but it will block promotion to main."
          fi
          exit 0

  # ---------------------------------------------------------------------------
  # build-advisor — push Dockerfile.advisor to GHCR
  # Runs only on push to main, gated on all CI jobs passing.
  #
  # Test gate: to prevent merge of failing code, enable branch protection on
  # main/dev in GitHub Settings › Branches and mark the Lint, TypeScript
  # typecheck, Python tests, and Golden-case deploy gate jobs as required
  # status checks. `needs` already blocks the build when the gate is held; the
  # branch-protection entry is what additionally blocks the dev → main merge
  # that would trigger it.
  # ---------------------------------------------------------------------------
  build-advisor:
    name: Build advisor image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, golden-gate]
    # `success() &&` is load-bearing, not decorative. Actions applies the
    # implicit success()-on-needs check only to jobs with NO `if:` of their own;
    # writing a custom condition replaces it outright. Without it this job runs
    # on every push to main even with the golden gate HELD — `needs` would order
    # the jobs without gating them, and ABS-485's enforcement would be a comment.
    # Pinned by tests/scripts/test_check_deploy_gate.py.
    if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bylaw-advisor
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.advisor
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=advisor
          cache-to: type=gha,mode=max,scope=advisor
          platforms: linux/amd64

  # ---------------------------------------------------------------------------
  # build-web — push web/Dockerfile to GHCR
  # Runs only on push to main, gated on all CI jobs passing.
  #
  # Required secrets (configure in GitHub Settings › Secrets and variables):
  #   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY  — inlined into the client bundle
  #   NEXT_PUBLIC_SENTRY_DSN             — optional, inlined into client bundle
  # ---------------------------------------------------------------------------
  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, golden-gate]
    # See build-advisor: a custom `if:` drops the implicit success()-on-needs,
    # so this must restate it or a held gate will not stop the prod web image.
    if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bylaw-web
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_RELEASE=${{ github.sha }}
