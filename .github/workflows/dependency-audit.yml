name: Dependency Vulnerability Scan

on:
  push:
    branches: [main, dev]
    paths:
      - "pyproject.toml"
      - "web/package.json"
      - "web/package-lock.json"
  pull_request:
    branches: [main, dev]
    paths:
      - "pyproject.toml"
      - "web/package.json"
      - "web/package-lock.json"
  schedule:
    - cron: "0 8 * * 1"  # Weekly Monday 08:00 UTC

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: pip install ".[dev]"

      - name: Run pip-audit
        # No --strict: the project's own package (layer1-bylaw-ingest) is
        # local-only, so its "not found on PyPI" skip must not be fatal.
        # pip-audit still exits non-zero on any real vulnerability finding.
        run: pip-audit --desc on

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production)
        run: npm audit --omit=dev
