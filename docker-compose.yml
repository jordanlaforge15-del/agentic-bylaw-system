services:
  # Dev Postgres. Hosts the `layer1` database ONLY. The e2e suite runs
  # against the dedicated ephemeral `postgres-e2e` service below
  # (ABS-428) — nothing test-shaped is ever created on this instance,
  # and e2e tooling never starts/stops this service.
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: agentic-bylaw-system-postgres:pg16-pgvector-postgis
    environment:
      POSTGRES_DB: layer1
      POSTGRES_USER: layer1
      POSTGRES_PASSWORD: layer1
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - layer1-postgres:/var/lib/postgresql/data
    # Cap how long an idle-in-transaction or any single statement can
    # tie up a backend. The advisor's spatial scan over 11k zoning
    # polygons runs in seconds normally, but if a client disconnects
    # mid-stream the SQLAlchemy session may not roll back promptly —
    # without a server-side cap, that can wedge a connection (and any
    # row locks it holds) indefinitely. 60s/120s is generous enough
    # for any legitimate query and short enough to self-heal.
    #
    # The defaults are exported as env vars so long-running workflows
    # (e.g. Layer 1 ingest of a 200+ page bylaw, which holds one
    # transaction across the full pdfplumber parse + per-page block
    # extraction + table extraction + insert) can opt out without
    # editing this file. Recipe documented in docs/E2E_TESTING.md /
    # docs/DEV_DB_BACKUP.md. Setting either to "0" disables that
    # particular cap (Postgres default). ABS-100.
    command: >
      postgres
      -c idle_in_transaction_session_timeout=${PG_IDLE_IN_TXN_TIMEOUT:-60000}
      -c statement_timeout=${PG_STATEMENT_TIMEOUT:-120000}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layer1 -d layer1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated e2e Postgres (ABS-428). Ephemeral by design: hosts
  # `layer1_test` ONLY (no `layer1`), lives in its own named volume, and
  # scripts/e2e-down.sh destroys both the container AND the volume so
  # every `make e2e` starts from a pristine instance (fresh initdb +
  # migrations + seeds).
  #
  # The `e2e` profile keeps this service invisible to every dev-side
  # compose invocation: bare `docker compose up`/`down`, `make db-up`/
  # `db-down`, and scripts/dev-up.sh (which targets the `postgres`
  # service by name) can neither start nor stop it. Only the e2e
  # scripts, which name `postgres-e2e` explicitly, touch it.
  #
  # Host port defaults to 5433 and is parametrized so multiple worktrees
  # can each `make e2e` concurrently (PG_PORT=543X convention;
  # scripts/e2e-up.sh derives E2E_POSTGRES_HOST_PORT from PG_PORT).
  postgres-e2e:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: agentic-bylaw-system-postgres:pg16-pgvector-postgis
    profiles: ["e2e"]
    environment:
      POSTGRES_DB: layer1_test
      POSTGRES_USER: layer1
      POSTGRES_PASSWORD: layer1
    ports:
      - "${E2E_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - layer1-postgres-e2e:/var/lib/postgresql/data
    # Same runtime caps as the dev service (ABS-100) — the e2e suite
    # exercises the identical spatial scans and benefits from the same
    # self-healing on wedged connections.
    command: >
      postgres
      -c idle_in_transaction_session_timeout=${PG_IDLE_IN_TXN_TIMEOUT:-60000}
      -c statement_timeout=${PG_STATEMENT_TIMEOUT:-120000}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layer1 -d layer1_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # Local-dev Next.js. Uses node:22-alpine directly (not web/Dockerfile,
    # which is the optimised production build) so NEXT_PUBLIC_* vars are
    # read at runtime — no rebuild needed when you change keys. Mounts
    # web/ as a volume so hot-reload works against your editor.
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env.local
    environment:
      # Override ADVISOR_API_URL so the web container reaches the host
      # uvicorn (running outside Docker) instead of trying 127.0.0.1
      # inside its own network namespace.
      ADVISOR_API_URL: http://host.docker.internal:8000
      # Local web → local postgres (the postgres service in this
      # compose) for the invite_request table. Override in .env.local
      # if pointing at the production DB.
      DATABASE_URL: postgresql://layer1:layer1@postgres:5432/layer1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: agentic-bylaw-system-codex:latest
    container_name: agentic-bylaw-system-codex
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_HOME: /home/codex/.codex
      NPM_CONFIG_PREFIX: /home/codex/.npm-global
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      DATABASE_URL: postgresql+psycopg://layer1:layer1@postgres:5432/layer1
    volumes:
      - .:/workspace
      - codex-home:/home/codex/.codex
      - codex-cache:/home/codex/.cache
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c 'codex --dangerously-bypass-approvals-and-sandbox'

volumes:
  layer1-postgres:
  # Ephemeral e2e data volume — removed by scripts/e2e-down.sh after
  # every run (ABS-428). Never holds anything worth keeping.
  layer1-postgres-e2e:
  codex-home:
  codex-cache:
  web-node-modules:
