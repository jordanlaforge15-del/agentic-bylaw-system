[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layer1-bylaw-ingest"
version = "0.1.0"
description = "Layer 1 source normalization for municipal land-use bylaws"
readme = "README.md"
requires-python = ">=3.11"
# ... keep name, version, description, readme, requires-python as-is ...
dependencies = [
  "alembic>=1.13",
  "httpx>=0.27",
  "pgvector>=0.2",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "shapely>=2.0",
  "sqlalchemy>=2.0",
  "tenacity>=8.2",
  "typer>=0.12",
]

[project.optional-dependencies]
advisor = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.0",
  "pyjwt[crypto]>=2.8",
  "prometheus-client>=0.20",
  "sentry-sdk[fastapi]>=2.0",
  "stripe>=10.0",
  "svix>=1.40",
  # python-multipart is required by FastAPI for any multipart/form-data
  # endpoint (the submissions upload route — ABS-53). Without it FastAPI
  # raises RuntimeError at request time instead of import time, so the
  # missing dep doesn't show until a real upload is attempted.
  "python-multipart>=0.0.9",
  # pyproj + ifcopenshell are runtime deps of advisor.api.submissions_router
  # (Phase 2 BIM ingestion in the request path). pyproj is imported at module
  # load via layer2.compliance.derived_attributes — without it advisor crashes
  # at startup with ModuleNotFoundError, surfaced on the 0.8.3 deploy attempt
  # (advisor wouldn't boot). ifcopenshell imports are lazy inside parser
  # functions but still need to be installed so /v1/submissions IFC uploads
  # don't 500 at request time. Mirrored in [bim] for non-advisor consumers.
  "pyproj>=3.6",
  "ifcopenshell>=0.7",
  # NOTE (ABS-522): jsonschema was a runtime dep here for exactly one
  # consumer — advisor.llm.claude_code_translation, which had to validate
  # `claude -p` envelope tool calls in-process because the CLI gave no
  # schema guarantee. That module is gone and the tool_use path gets its
  # validation from the API, so the advisor runtime no longer needs it.
  # It stays a [dev] dep; only the deployed image loses it.
]
ingest = [
  "docling>=2.0",
  "openai>=1.40",
  "pymupdf>=1.23",
  "pdfplumber>=0.10",
]
bim = [
  # Phase 2 (ABS-49): IFC ingestion. Open-source toolkit, pip-installable
  # wheels on macOS / Linux / Windows. APS / .rvt path lives in a separate
  # extras group when it lands.
  "ifcopenshell>=0.7",
  # Phase 2 (ABS-52): coord-system transforms (project-local → EPSG:2961 / 4326).
  # geopandas pulls pyproj transitively but Phase-1 deliberately avoided
  # the dep — ABS-52 makes it explicit because Stane Plane reprojection
  # has to be exact, not the local-tangent-plane approximation that
  # layer2.spatial.lot_metrics rolls.
  "pyproj>=3.6",
]
api = []
mcp = [
  "mcp[cli]>=1.27",
]
parsers = [
  "camelot-py[cv]>=0.11",
  "paddleocr>=2.7",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "jsonschema>=4.0",
  "ruff>=0.5",
  "tldextract>=5.1",
  "pip-audit>=2.7",
]

[project.scripts]
layer1 = "layer1.cli:app"
layer1-retrieval-api = "bylaw_retrieval.api.app:main"
layer1-mcp = "bylaw_retrieval.server:main"
layer2 = "layer2.cli:app"

[tool.setuptools.packages.find]
where = ["src", "mcp"]

# Non-.py files the installed package reads at runtime. Without these the
# wheel ships bare .py files and module-relative loads fail only in deployed
# images (ABS-412; surfaced as FileNotFoundError during the ABS-409 prod
# heal).
#
# layer1/datasets/*.yaml were once listed here as "deliberately absent —
# ingest inputs addressed by repo-relative CLI paths, never resolved
# module-relative". That stopped being true when ABS-356's corpus-coherence
# audit started reading them as its declaration set: the deployed advisor
# resolves them module-relative on every /v1/monitoring/corpus-coherence
# request. Absent from the wheel, that audit checked zero roles and reported
# a green it had not earned (ABS-420).
[tool.setuptools.package-data]
# lookups/*.yaml too: two configs pull their shared by-law-area table with
# `lookups_from: lookups/hrm_bylaw_areas.yaml`, resolved relative to the
# config. Shipping the configs without it turns the audit's FileNotFoundError
# into a ValueError one directory deeper.
"layer1.datasets" = ["*.yaml", "lookups/*.yaml"]
"layer1.semantic" = ["*.json"]
"layer2.prompts" = ["assets/*.txt"]
"layer2.compliance.attributes" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the project root on sys.path so tests can import the `scripts`
# package by its fully-qualified name (e.g. `scripts.rechain_migration`,
# `scripts.linear_client`). Before ABS-446 that job was done by a sys.path
# hack in tests/night_manager/conftest.py, which went with the NM fork.
#
# It is listed LAST deliberately. pytest walks this list in reverse and
# inserts each entry at sys.path[0], so the final sys.path order matches the
# list order — the FIRST entry wins. The project root is the broadest entry
# (it makes every top-level directory importable, including bare ones like
# mcp/ and alembic/ that share a name with a distribution), so it takes the
# lowest precedence of the five.
pythonpath = ["src", "mcp", "tests", "scripts", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
